[project]
name = "mcp-stock"
version = "0.1.0"
description = "MCP server for stock market data"
requires-python = ">=3.11"
dependencies = [
    "mcp==1.28.1",
    "tushare>=1.4.29",
]

[tool.setuptools.packages.find]
include = ["mcp_stock*"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
