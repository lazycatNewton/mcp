name: Release To Production

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: mcp-production-release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify Release Source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: mcp_stock
    outputs:
      sha: ${{ steps.source.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install .
      - run: python -m compileall -q .
      - run: PYTHONPATH=.. python -m mcp_stock --help >/dev/null

  publish:
    name: Build And Publish Image
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    env:
      REGISTRY: registry.lazycatnewton.online
      SOURCE_SHA: ${{ needs.verify.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USERNAME }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: mcp_stock
          file: mcp_stock/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/mcp-stock/mcp-stock:${{ env.SOURCE_SHA }}

  deploy:
    name: Update GitOps Image
    needs:
      - verify
      - publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE_DIGEST: ${{ needs.publish.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
        with:
          repository: lazycatNewton/deployment-config
          ref: main
          path: deployment-config
          ssh-key: ${{ secrets.DEPLOYMENT_CONFIG_SSH_KEY }}
      - name: Update immutable image digest
        run: |
          set -euo pipefail
          case "$IMAGE_DIGEST" in
            sha256:*) ;;
            *) echo "invalid image digest" >&2; exit 1 ;;
          esac
          cd deployment-config
          deployment=clusters/production/apps/mcp-stock/deployment.yaml
          test -f "$deployment"
          perl -0pi -e 's{image: registry\.lazycatnewton\.online/mcp-stock/mcp-stock(?:[:@])\S+}{"image: registry.lazycatnewton.online/mcp-stock/mcp-stock\@$ENV{IMAGE_DIGEST}"}e' "$deployment"
          git diff --check
          git diff --quiet && exit 0
          git config user.name "mcp release bot"
          git config user.email "mcp-release-bot@users.noreply.github.com"
          git add "$deployment"
          git commit -m "deploy(mcp-stock): ${IMAGE_DIGEST}"
          for attempt in 1 2 3; do
            git push origin main && exit 0
            git pull --rebase origin main
          done
          exit 1
